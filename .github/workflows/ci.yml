name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  verify:
    name: Source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.94.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt

      - name: Install verification tools
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly audit_archive="${RUNNER_TEMP}/cargo-audit.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            --output "${audit_archive}"
          printf '%s  %s\n' \
            ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39 \
            "${audit_archive}" |
            sha256sum --check
          tar -xzf "${audit_archive}" -C "${RUNNER_TEMP}" \
            cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
          install -m 0555 \
            "${RUNNER_TEMP}/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit" \
            "${HOME}/.cargo/bin/cargo-audit"

          readonly archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "${archive}"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "${archive}" |
            sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0555 "${RUNNER_TEMP}/gitleaks" "${HOME}/.cargo/bin/gitleaks"

      - name: Scan the complete history for secrets
        shell: bash
        run: gitleaks git . --log-opts=--all --no-banner --redact

      - name: Audit locked dependencies
        shell: bash
        run: cargo +1.94.0 audit

      - name: Check formatting
        shell: bash
        run: cargo +1.94.0 fmt --all -- --check

      - name: Check all targets
        shell: bash
        run: cargo +1.94.0 check --workspace --all-targets --locked

      - name: Run Clippy
        shell: bash
        run: cargo +1.94.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        shell: bash
        run: cargo +1.94.0 test --workspace --locked

      - name: Verify repository and protocol conformance
        shell: bash
        run: |
          set -Eeuo pipefail
          tests/check_brand.sh
          tests/conformance/verify_workflow_frontend.sh
          python3 tests/conformance/check_schema.py
          python3 tests/conformance/check_openapi_routes.py
          python3 tests/conformance/check_migrations.py
          deploy/tests/validate.sh

      - name: Build the runner image
        shell: bash
        run: docker build --tag runtrue/runner-node:verify images/runner-node
