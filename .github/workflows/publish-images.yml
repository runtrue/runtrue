name: Publish runtime images

on:
  pull_request:
    paths:
      - ".github/workflows/publish-images.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bins/**"
      - "crates/**"
      - "deploy/Containerfile.runner"
      - "deploy/Containerfile.runner.dockerignore"
      - "deploy/Containerfile.autoscaler"
      - "deploy/Containerfile.autoscaler.dockerignore"
      - "deploy/Containerfile.server"
      - "deploy/Containerfile.server.dockerignore"
      - "deploy/containers-oci.conf"
      - "deploy/healthcheck.sh"
      - "proto/**"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-runtime-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: runtrue

jobs:
  build:
    name: Build ${{ matrix.title }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Runtrue control plane (amd64)
            image: runtrue-server
            artifact: runtrue-server-amd64
            file: ./deploy/Containerfile.server
            platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - title: Runtrue control plane (arm64)
            image: runtrue-server
            artifact: runtrue-server-arm64
            file: ./deploy/Containerfile.server
            platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
          - title: Runtrue runner (amd64)
            image: runtrue-runner
            artifact: runtrue-runner-amd64
            file: ./deploy/Containerfile.runner
            platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - title: Runtrue runner (arm64)
            image: runtrue-runner
            artifact: runtrue-runner-arm64
            file: ./deploy/Containerfile.runner
            platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
          - title: Runtrue autoscaler (amd64)
            image: runtrue-autoscaler
            artifact: runtrue-autoscaler-amd64
            file: ./deploy/Containerfile.autoscaler
            platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - title: Runtrue autoscaler (arm64)
            image: runtrue-autoscaler
            artifact: runtrue-autoscaler-arm64
            file: ./deploy/Containerfile.autoscaler
            platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve immutable build identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
              { echo "release tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
            version="${RELEASE_TAG#v}"
            workspace_version="$(cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "runtrue") | .version')"
            [[ "$version" == "$workspace_version" ]] ||
              { echo "release tag does not match workspace version" >&2; exit 1; }
          else
            version="0.0.0-pr.${PR_NUMBER}"
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'revision=%s\n' "$GITHUB_SHA"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build credential-free OCI evidence
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=oci,dest=/tmp/${{ matrix.artifact }}.oci.tar
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ steps.identity.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            org.opencontainers.image.revision=${{ steps.identity.outputs.revision }}
            org.opencontainers.image.source=https://github.com/runtrue/runtrue
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            RUNTRUE_VERSION=${{ steps.identity.outputs.version }}
            RUNTRUE_REVISION=${{ steps.identity.outputs.revision }}
          provenance: mode=max
          sbom: true

      - name: Verify native-platform OCI evidence
        shell: bash
        env:
          ARCHIVE: /tmp/${{ matrix.artifact }}.oci.tar
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -Eeuo pipefail
          test -s "$ARCHIVE"
          index="$(mktemp)"
          skopeo inspect --raw "oci-archive:${ARCHIVE}" >"$index"
          jq -e --arg architecture "$EXPECTED_ARCHITECTURE" '
            [.manifests[].platform |
              select(.os == "linux") |
              .architecture] as $architectures |
            ($architectures | length) == 1 and
            $architectures[0] == $architecture
          ' "$index" >/dev/null
          (
            cd /tmp
            sha256sum "${ARCHIVE##*/}" >"${ARCHIVE##*/}.sha256"
          )

      - name: Transfer immutable release evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            /tmp/${{ matrix.artifact }}.oci.tar
            /tmp/${{ matrix.artifact }}.oci.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  promote:
    name: Promote approved runtime images
    if: >-
      github.event_name == 'push' &&
      github.repository_visibility == 'public' &&
      vars.RUNTIME_IMAGE_PROMOTION_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Download exact build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-image-*-${{ github.sha }}
          path: ${{ runner.temp }}/release-images
          merge-multiple: true

      - name: Verify complete release evidence
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/release-images
        run: |
          set -Eeuo pipefail
          cd "$EVIDENCE_DIR"
          expected="$(
            printf '%s\n' \
              runtrue-autoscaler-amd64.oci.tar \
              runtrue-autoscaler-amd64.oci.tar.sha256 \
              runtrue-autoscaler-arm64.oci.tar \
              runtrue-autoscaler-arm64.oci.tar.sha256 \
              runtrue-runner-amd64.oci.tar \
              runtrue-runner-amd64.oci.tar.sha256 \
              runtrue-runner-arm64.oci.tar \
              runtrue-runner-arm64.oci.tar.sha256 \
              runtrue-server-amd64.oci.tar \
              runtrue-server-amd64.oci.tar.sha256 \
              runtrue-server-arm64.oci.tar \
              runtrue-server-arm64.oci.tar.sha256 |
              LC_ALL=C sort
          )"
          actual="$(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]] ||
            { echo "release evidence inventory mismatch" >&2; exit 1; }
          sha256sum --check ./*.sha256

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote exact OCI evidence
        id: promote
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/release-images
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" == "v${version}" ]]
          declare -A digests

          for component in runtrue-server runtrue-runner runtrue-autoscaler; do
            image="${REGISTRY}/${IMAGE_NAMESPACE}/${component}"
            for architecture in amd64 arm64; do
              archive="${EVIDENCE_DIR}/${component}-${architecture}.oci.tar"
              digest="sha256:$(skopeo inspect --raw "oci-archive:${archive}" |
                sha256sum | awk '{print $1}')"
              staged_tag="sha-${GITHUB_SHA}-${architecture}"
              skopeo copy --all --preserve-digests \
                "oci-archive:${archive}" \
                "docker://${image}:${staged_tag}"
              staged="sha256:$(skopeo inspect --raw "docker://${image}:${staged_tag}" |
                sha256sum | awk '{print $1}')"
              [[ "$staged" == "$digest" ]] ||
                { echo "registry changed ${component} ${architecture} evidence" >&2; exit 1; }
            done

            metadata="$(mktemp)"
            docker buildx imagetools create \
              --metadata-file "$metadata" \
              --tag "${image}:sha-${GITHUB_SHA}" \
              "${image}:sha-${GITHUB_SHA}-amd64" \
              "${image}:sha-${GITHUB_SHA}-arm64"
            digest="$(jq -r '.["containerimage.descriptor"].digest' "$metadata")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
              { echo "invalid ${component} index digest" >&2; exit 1; }
            index="$(mktemp)"
            skopeo inspect --raw "docker://${image}@${digest}" >"$index"
            published="sha256:$(sha256sum "$index" | awk '{print $1}')"
            [[ "$published" == "$digest" ]] ||
              { echo "registry changed ${component} index" >&2; exit 1; }
            jq -e '
              [.manifests[].platform |
                select(.os == "linux") |
                .architecture] as $architectures |
              ($architectures | map(select(. == "amd64")) | length) == 1 and
              ($architectures | map(select(. == "arm64")) | length) == 1
            ' "$index" >/dev/null
            digests["$component"]="$digest"
            printf '%s_digest=%s\n' "${component//-/_}" "$digest" >>"$GITHUB_OUTPUT"
          done

          for component in runtrue-server runtrue-runner runtrue-autoscaler; do
            image="${REGISTRY}/${IMAGE_NAMESPACE}/${component}"
            skopeo copy --all --preserve-digests \
              "docker://${image}@${digests[$component]}" \
              "docker://${image}:${version}"
            versioned="sha256:$(skopeo inspect --raw "docker://${image}:${version}" |
              sha256sum | awk '{print $1}')"
            [[ "$versioned" == "${digests[$component]}" ]] ||
              { echo "registry changed ${component} version tag" >&2; exit 1; }
          done

      - name: Attest published server image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/runtrue-server
          subject-digest: ${{ steps.promote.outputs.runtrue_server_digest }}
          push-to-registry: true

      - name: Attest published runner image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/runtrue-runner
          subject-digest: ${{ steps.promote.outputs.runtrue_runner_digest }}
          push-to-registry: true

      - name: Attest published autoscaler image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/runtrue-autoscaler
          subject-digest: ${{ steps.promote.outputs.runtrue_autoscaler_digest }}
          push-to-registry: true
