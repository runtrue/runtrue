openapi: 3.1.0
info:
  title: Runtrue API
  version: 0.1.0
  description: >-
    Preliminary control-plane contract. Mutation responses may include
    Idempotency-Replayed. Secret values and enrollment bearer tokens are never
    returned by read endpoints. Enrolled-runner secret and OIDC broker RPCs
    use the separately versioned `runtrue.runner.v1.RunnerControl` protobuf
    contract; they require mTLS plus a live certificate-owned Open session and
    are intentionally not modeled as HTTP endpoints here.
servers:
  - url: https://ci.example.com
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /readyz:
    get:
      operationId: readiness
      security: []
      responses:
        '200':
          description: Durable control plane is ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /.well-known/openid-configuration:
    get:
      operationId: getOidcDiscovery
      security: []
      responses:
        '200':
          description: Workload identity issuer metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OidcDiscovery'}
  /oidc/jwks.json:
    get:
      operationId: getOidcJwks
      security: []
      responses:
        '200':
          description: Active OIDC verification keys
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JwkSet'}
        '409': {$ref: '#/components/responses/Conflict'}
  /webhooks/github:
    post:
      operationId: ingestGithubWebhook
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: {type: string, maxLength: 256}
        - name: X-GitHub-Event
          in: header
          required: true
          schema: {type: string, maxLength: 128}
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema: {type: string, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '202': {description: Authenticated event durably accepted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/github/app/callback:
    get:
      operationId: finishGithubAppInstallation
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: {type: string, minLength: 43, maxLength: 256}
        - name: installation_id
          in: query
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: setup_action
          in: query
          required: false
          schema: {type: string, enum: [install, update]}
      responses:
        '303': {description: Exact installation verified and redirected to its bound local return path}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {description: Bounded GitHub provider verification failed}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/login:
    get:
      operationId: beginGithubOauthLogin
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          schema: {type: string, pattern: '^/(?!/)', maxLength: 2048}
      responses:
        '302': {description: Redirect to GitHub OAuth with state, nonce, and S256 challenge}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/callback:
    get:
      operationId: finishGithubOauthLogin
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 8192}
        - name: state
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
      responses:
        '303': {description: Verified GitHub identity session created}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/scm/github:
    get:
      operationId: getGithubAppStatus
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: {type: string, maxLength: 8192}
      responses:
        '200':
          description: Tenant-filtered, credential-free installation and repository status
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/scm/github/setup-transactions:
    post:
      operationId: createGithubAppSetupTransaction
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tenant_id: {type: string, maxLength: 8192}
                return_path: {type: string, pattern: '^/[^\\#]*$', maxLength: 2048}
      responses:
        '201':
          description: One-use setup state durably reserved
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [id, install_url, expires_unix_ms, replayed]
                properties:
                  id: {type: string}
                  install_url: {type: string, format: uri}
                  expires_unix_ms: {type: integer, format: uint64}
                  replayed: {type: boolean}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/scm/github/installations/{installation_id}/sync:
    post:
      operationId: syncGithubAppInstallation
      parameters:
        - name: installation_id
          in: path
          required: true
          schema: {type: string, maxLength: 8192}
        - name: tenant_id
          in: query
          required: false
          schema: {type: string, maxLength: 8192}
      responses:
        '200': {description: Provider-verified installation and selected repository catalog reconciled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {description: Bounded GitHub provider verification failed}
  /api/v1/scm/github/installations/{installation_id}:
    delete:
      operationId: revokeGithubAppInstallation
      parameters:
        - name: installation_id
          in: path
          required: true
          schema: {type: string, maxLength: 8192}
        - name: tenant_id
          in: query
          required: false
          schema: {type: string, maxLength: 8192}
      responses:
        '204': {description: Runtrue access revoked; provider-side uninstall remains operator controlled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /ui/github/installations/start:
    post:
      operationId: startGithubAppInstallationFromUi
      security:
        - browserAccess: []
          browserCsrf: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf_token, idempotency_key]
              properties:
                csrf_token: {type: string}
                idempotency_key: {type: string}
      responses:
        '303': {description: Redirect to the exact provider-owned installation URL}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /ui/github/repositories/link:
    post:
      operationId: linkGithubRepositoryFromUi
      security:
        - browserAccess: []
          browserCsrf: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf_token, installation_id, external_repository_id]
              properties:
                csrf_token: {type: string}
                installation_id: {$ref: '#/components/schemas/Identifier'}
                external_repository_id: {type: string, pattern: '^[1-9][0-9]*$'}
      responses:
        '303': {description: Selected provider repository onboarded and linked}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/repositories:
    get:
      operationId: listRepositories
      responses:
        '200':
          description: Repository page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createRepository
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRepositoryRequest'}
      responses:
        '201':
          description: Repository created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/repositories/{repository_id}:
    get:
      operationId: getRepository
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
      responses:
        '200':
          description: Repository
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/repositories/{repository_id}/capsules:
    post:
      operationId: createCapsule
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCapsuleRequest'}
      responses:
        '201':
          description: Workflow compiled and exact canonical capsule signed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionCapsule'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/capsules/{capsule_id}:
    get:
      operationId: getCapsule
      parameters:
        - {$ref: '#/components/parameters/CapsuleId'}
      responses:
        '200':
          description: Signed execution capsule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionCapsule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/capsules/{capsule_id}/runs:
    post:
      operationId: createRun
      parameters:
        - {$ref: '#/components/parameters/CapsuleId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
      responses:
        '201':
          description: Authorized run and jobs durably created
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/runs:
    get:
      operationId: listRuns
      parameters:
        - name: repository_id
          in: query
          schema: {$ref: '#/components/schemas/Identifier'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Stable ID-ordered run page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/runs/{run_id}:
    get:
      operationId: getRun
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/runs/{run_id}/logs:
    get:
      operationId: getRunLogs
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 10000, default: 1000}
      responses:
        '200':
          description: Ordered, redacted runner log frames for the authorized run
          headers:
            Cache-Control:
              description: Run logs are never stored by intermediaries.
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: array
                maxItems: 10000
                items: {$ref: '#/components/schemas/RunLogFrame'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRunRequest'}
      responses:
        '202':
          description: Cancellation durably requested
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/runs/{run_id}/replay-bundle:
    post:
      operationId: createReplayBundle
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '201':
          description: Canonical replay bundle sealed and stored
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplayBundleMetadata'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      operationId: getReplayBundle
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Canonical sealed replay envelope
          content:
            application/vnd.runtrue.replay+json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/approval-requests:
    get:
      operationId: listApprovalRequests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, denied, expired, consumed]
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Stable ID-ordered approval page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/approval-requests/{approval_id}:
    get:
      operationId: getApprovalRequest
      parameters:
        - {$ref: '#/components/parameters/ApprovalId'}
      responses:
        '200':
          description: Approval request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/approval-requests/{approval_id}/decisions:
    post:
      operationId: decideApproval
      parameters:
        - {$ref: '#/components/parameters/ApprovalId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecisionRequest'}
      responses:
        '201':
          description: Exact-subject decision and any bounded SCM continuation task durably recorded; no repository I/O occurs in this request
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalRequest'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/runner-pools:
    get:
      operationId: listRunnerPools
      responses:
        '200':
          description: Runner pools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerPoolItems'
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createRunnerPool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, tenant_id, name]
              properties:
                id: {$ref: '#/components/schemas/Identifier'}
                tenant_id: {$ref: '#/components/schemas/Identifier'}
                name: {type: string, minLength: 1, maxLength: 8192}
                region: {type: ['string', 'null'], minLength: 1, maxLength: 8192}
      responses:
        '201':
          description: Active runner pool created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunnerPool'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/runner-pools/trust/capsule-key:
    get:
      operationId: getRunnerCapsuleTrustKey
      responses:
        '200':
          description: Current Ed25519 capsule verification key for runner trust configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [key_id, algorithm, public_key_hex]
                properties:
                  key_id: {$ref: '#/components/schemas/Digest'}
                  algorithm: {type: string, const: ed25519}
                  public_key_hex: {type: string, pattern: '^[0-9a-f]{64}$'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/runner-pools/{runner_pool_id}:
    get:
      operationId: getRunnerPool
      parameters:
        - {$ref: '#/components/parameters/RunnerPoolId'}
      responses:
        '200':
          description: Runner pool
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunnerPool'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/runner-pools/{runner_pool_id}/enrollment-tokens:
    post:
      operationId: createRunnerEnrollmentToken
      parameters:
        - {$ref: '#/components/parameters/RunnerPoolId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEnrollmentTokenRequest'}
      responses:
        '201':
          description: One-time bearer value; it is not replayed on an idempotent retry
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Cache-Control:
              description: One-time bearer responses are never cacheable.
              schema: {type: string, const: no-store}
            Pragma:
              description: Legacy cache prevention for the one-time bearer response.
              schema: {type: string, const: no-cache}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentToken'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/runners:
    get:
      operationId: listRunners
      responses:
        '200':
          description: Runners
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunnerItems'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/runners/{runner_id}:
    get:
      operationId: getRunner
      parameters:
        - {$ref: '#/components/parameters/RunnerId'}
      responses:
        '200':
          description: Runner
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Runner'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/runners/{runner_id}/drain:
    post:
      operationId: drainRunner
      parameters:
        - {$ref: '#/components/parameters/RunnerId'}
      responses:
        '202':
          description: Runner durably entered draining state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Runner'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/scopes/{scope}/secrets:
    get:
      operationId: listSecretMetadata
      parameters:
        - {$ref: '#/components/parameters/Scope'}
      responses:
        '200':
          description: Secret references and metadata only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretMetadataItems'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createSecret
      parameters:
        - {$ref: '#/components/parameters/Scope'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSecretRequest'}
      responses:
        '201':
          description: Secret encrypted or external reference stored; value is omitted
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretMetadata'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/scopes/{scope}/secrets/{name}:
    parameters:
      - {$ref: '#/components/parameters/Scope'}
      - {$ref: '#/components/parameters/Name'}
    get:
      operationId: getSecretMetadata
      responses:
        '200':
          description: Secret metadata only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretMetadata'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: rotateSecret
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotateSecretRequest'}
      responses:
        '200':
          description: New immutable encrypted version stored; value is omitted
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
