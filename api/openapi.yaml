          properties:
            observed_unix_ms: {type: integer, minimum: 0}
            tenant_id: {$ref: '#/components/schemas/Identifier'}
            actor: {type: object}
            action: {type: string}
            resource: {type: object}
            result: {type: string}
            request_id: {type: string}
            decision_id: {type: string}
            metadata: {type: object}
        event_hash: {$ref: '#/components/schemas/Digest'}
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        next_cursor: {type: ['string', 'null']}
    OidcDiscovery:
      type: object
      additionalProperties: false
      required: [issuer, jwks_uri, subject_types_supported, id_token_signing_alg_values_supported]
      properties:
        issuer: {type: string, format: uri}
        jwks_uri: {type: string, format: uri}
        subject_types_supported: {type: array, items: {type: string}}
        id_token_signing_alg_values_supported: {type: array, items: {type: string}}
    Jwk:
      type: object
      additionalProperties: false
      required: [kty, crv, alg, use, kid, x]
      properties:
        kty: {type: string, const: OKP}
        crv: {type: string, const: Ed25519}
        alg: {type: string, const: EdDSA}
        use: {type: string, const: sig}
        kid: {$ref: '#/components/schemas/Digest'}
        x: {type: string}
    JwkSet:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys: {type: array, items: {$ref: '#/components/schemas/Jwk'}}
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, request_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        request_id: {type: string}
