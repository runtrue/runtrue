          description: Tenant-scoped API token metadata; bearer values are never returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiTokenPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
