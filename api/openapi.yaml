      properties:
        pool_id: {$ref: '#/components/schemas/Identifier'}
        owner_id: {$ref: '#/components/schemas/Identifier'}
        fencing_generation: {type: integer, minimum: 1}
        acquired_unix_ms: {type: integer, minimum: 0}
