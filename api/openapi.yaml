        name: {type: string, minLength: 1, maxLength: 8192}
        default_branch: {type: string, minLength: 1, maxLength: 8192, default: main}
        visibility: {type: string, minLength: 1, maxLength: 8192, default: private}
    RepositoryPage:
      type: object
      additionalProperties: false
