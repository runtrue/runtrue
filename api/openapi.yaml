openapi: 3.1.0
info:
  title: Runtrue API
  version: 0.1.0
  description: >-
    Preliminary control-plane contract. Mutation responses may include
    Idempotency-Replayed. Secret values and enrollment bearer tokens are never
    returned by read endpoints. Enrolled-runner secret and OIDC broker RPCs
    use the separately versioned `runtrue.runner.v1.RunnerControl` protobuf
    contract; they require mTLS plus a live certificate-owned Open session and
    are intentionally not modeled as HTTP endpoints here.
servers:
  - url: https://ci.example.com
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /readyz:
    get:
      operationId: readiness
      security: []
      responses:
        '200':
          description: Durable control plane is ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /.well-known/openid-configuration:
    get:
      operationId: getOidcDiscovery
      security: []
      responses:
        '200':
          description: Workload identity issuer metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OidcDiscovery'}
  /oidc/jwks.json:
    get:
      operationId: getOidcJwks
      security: []
      responses:
        '200':
          description: Active OIDC verification keys
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JwkSet'}
        '409': {$ref: '#/components/responses/Conflict'}
  /webhooks/github:
    post:
      operationId: ingestGithubWebhook
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: {type: string, maxLength: 256}
        - name: X-GitHub-Event
          in: header
          required: true
          schema: {type: string, maxLength: 128}
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema: {type: string, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '202': {description: Authenticated event durably accepted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/github/app/callback:
    get:
      operationId: finishGithubAppInstallation
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: {type: string, minLength: 43, maxLength: 256}
        - name: installation_id
          in: query
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: setup_action
          in: query
          required: false
          schema: {type: string, enum: [install, update]}
      responses:
        '303': {description: Exact installation verified and redirected to its bound local return path}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {description: Bounded GitHub provider verification failed}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/login:
    get:
      operationId: beginGithubOauthLogin
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          schema: {type: string, pattern: '^/(?!/)', maxLength: 2048}
      responses:
        '302': {description: Redirect to GitHub OAuth with state, nonce, and S256 challenge}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/callback:
    get:
      operationId: finishGithubOauthLogin
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 8192}
        - name: state
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
      responses:
        '303': {description: Verified GitHub identity session created}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/scm/github:
    get:
      operationId: getGithubAppStatus
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: {type: string, maxLength: 8192}
      responses:
        '200':
          description: Tenant-filtered, credential-free installation and repository status
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/scm/github/setup-transactions:
    post:
      operationId: createGithubAppSetupTransaction
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tenant_id: {type: string, maxLength: 8192}
                return_path: {type: string, pattern: '^/[^\\#]*$', maxLength: 2048}
      responses:
        '201':
          description: One-use setup state durably reserved
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [id, install_url, expires_unix_ms, replayed]
                properties:
                  id: {type: string}
                  install_url: {type: string, format: uri}
                  expires_unix_ms: {type: integer, format: uint64}
                  replayed: {type: boolean}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/scm/github/installations/{installation_id}/sync:
    post:
      operationId: syncGithubAppInstallation
      parameters:
        - name: installation_id
          in: path
          required: true
          schema: {type: string, maxLength: 8192}
        - name: tenant_id
          in: query
          required: false
          schema: {type: string, maxLength: 8192}
      responses:
        '200': {description: Provider-verified installation and selected repository catalog reconciled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {description: Bounded GitHub provider verification failed}
  /api/v1/scm/github/installations/{installation_id}:
    delete:
      operationId: revokeGithubAppInstallation
      parameters:
        - name: installation_id
          in: path
          required: true
          schema: {type: string, maxLength: 8192}
        - name: tenant_id
          in: query
          required: false
          schema: {type: string, maxLength: 8192}
      responses:
        '204': {description: Runtrue access revoked; provider-side uninstall remains operator controlled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /github/installations/start:
    post:
      operationId: startGithubAppInstallationFromUi
      security:
        - browserAccess: []
          browserCsrf: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf_token, idempotency_key]
              properties:
                csrf_token: {type: string}
                idempotency_key: {type: string}
      responses:
        '303': {description: Redirect to the exact provider-owned installation URL}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /ui/github/repositories/link:
    post:
      operationId: linkGithubRepositoryFromUi
      security:
        - browserAccess: []
          browserCsrf: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf_token, installation_id, external_repository_id]
              properties:
                csrf_token: {type: string}
                installation_id: {$ref: '#/components/schemas/Identifier'}
                external_repository_id: {type: string, pattern: '^[1-9][0-9]*$'}
      responses:
        '303': {description: Selected provider repository onboarded and linked}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/repositories:
    get:
      operationId: listRepositories
      responses:
        '200':
          description: Repository page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createRepository
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRepositoryRequest'}
      responses:
        '201':
          description: Repository created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/repositories/{repository_id}:
    get:
      operationId: getRepository
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
      responses:
        '200':
          description: Repository
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/repositories/{repository_id}/access:
    get:
      operationId: listRepositoryAccessGrants
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
      responses:
        '200':
          description: Direct user and team repository grants
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryAccessGrantPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: putRepositoryAccessGrant
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutRepositoryAccessGrantRequest'}
      responses:
        '200': {description: Existing grant updated}
        '201': {description: Grant created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/repositories/{repository_id}/access/{grant_id}:
    delete:
      operationId: revokeRepositoryAccessGrant
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
        - name: grant_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Identifier'}
      responses:
        '204': {description: Grant revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/tenants/{tenant_id}/users:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Identifier'}
    get:
      operationId: listUsers
      responses:
        '200':
          description: Tenant user page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HumanUserPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateHumanUserRequest'}
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HumanUser'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/tenants/{tenant_id}/users/{user_id}:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Identifier'}
      - name: user_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Identifier'}
    get:
      operationId: getUser
      responses:
        '200':
          description: Tenant user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HumanUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateHumanUserRequest'}
      responses:
        '200': {description: User updated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/tenants/{tenant_id}/users/{user_id}/repositories:
    get:
      operationId: listEffectiveUserRepositoryAccess
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Identifier'}
        - name: user_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Identifier'}
      responses:
        '200':
          description: Strongest direct or team-inherited access for each repository
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EffectiveRepositoryAccessPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/tenants/{tenant_id}/teams:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Identifier'}
    get:
      operationId: listTeams
      responses:
        '200':
          description: Tenant team page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTeamRequest'}
      responses:
        '201': {description: Team created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/tenants/{tenant_id}/teams/{team_id}:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Identifier'}
      - name: team_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Identifier'}
    get:
      operationId: getTeam
      responses:
        '200': {description: Team}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateTeam
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTeamRequest'}
      responses:
        '200': {description: Team updated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/tenants/{tenant_id}/teams/{team_id}/members:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Identifier'}
      - name: team_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Identifier'}
    get:
      operationId: listTeamMembers
      responses:
        '200':
          description: Team membership page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamMembershipPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: addTeamMember
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddTeamMemberRequest'}
      responses:
        '200': {description: Existing member role unchanged}
        '201': {description: Member added or role changed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/tenants/{tenant_id}/teams/{team_id}/members/{user_id}:
    delete:
      operationId: removeTeamMember
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Identifier'}
        - name: team_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Identifier'}
        - name: user_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Identifier'}
      responses:
        '204': {description: Member removed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/repositories/{repository_id}/capsules:
    post:
      operationId: createCapsule
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCapsuleRequest'}
      responses:
        '201':
          description: Workflow compiled and exact canonical capsule signed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionCapsule'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/capsules/{capsule_id}:
    get:
      operationId: getCapsule
      parameters:
        - {$ref: '#/components/parameters/CapsuleId'}
      responses:
        '200':
          description: Signed execution capsule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionCapsule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/capsules/{capsule_id}/workflow-frontend-report:
    get:
      operationId: getWorkflowFrontendReport
      description: Returns the exact bounded source-translation diagnostic attachment. This client-produced compilation artifact is not Provider Evidence.
      parameters:
        - {$ref: '#/components/parameters/CapsuleId'}
      responses:
        '200':
          description: Exact workflow frontend compatibility report bytes
          headers:
            X-Runtrue-Content-Digest:
              description: Qualified SHA-256 digest signed into the capsule frontend provenance
              schema: {$ref: '#/components/schemas/Digest'}
            Cache-Control:
              schema: {type: string, const: 'private, no-store'}
          content:
            '*/*':
              schema: {type: string, format: binary, maxLength: 1048576}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/capsules/{capsule_id}/runs:
    post:
      operationId: createRun
      parameters:
        - {$ref: '#/components/parameters/CapsuleId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
      responses:
        '201':
          description: Authorized run and jobs durably created
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/runs:
    get:
      operationId: listRuns
      parameters:
        - name: repository_id
          in: query
          schema: {$ref: '#/components/schemas/Identifier'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Stable ID-ordered run page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/runs/{run_id}:
    get:
      operationId: getRun
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/events/{event_id}:
    get:
      operationId: getEvent
      description: Returns replay-safe event metadata; the stored payload is intentionally omitted.
      parameters:
        - {$ref: '#/components/parameters/EventId'}
      responses:
        '200':
          description: Durable event metadata and original delivery state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DurableEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/events/{event_id}/replay:
    post:
      operationId: replayEvent
      description: Queues an exact redelivery of a failed event using its immutable stored payload.
      parameters:
        - {$ref: '#/components/parameters/EventId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: Event replay durably queued
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventReplay'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/runs/{run_id}/logs:
    get:
      operationId: getRunLogs
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 10000, default: 1000}
      responses:
        '200':
          description: Ordered, redacted runner log frames for the authorized run
          headers:
            Cache-Control:
              description: Run logs are never stored by intermediaries.
