      required: [id, display_name, primary_email, status, created_unix_ms, updated_unix_ms, last_seen_unix_ms, version]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        display_name: {type: string, minLength: 1, maxLength: 512}
        primary_email: {type: string, format: email, maxLength: 320}
        status: {type: string, enum: [active, suspended, disabled]}
        created_unix_ms: {type: integer, minimum: 0}
        updated_unix_ms: {type: integer, minimum: 0}
        last_seen_unix_ms: {type: [integer, 'null'], minimum: 0}
        version: {type: integer, minimum: 1}
    CreateHumanUserRequest:
      type: object
