          oneOf:
            - {type: object, additionalProperties: false, required: [user], properties: {user: {$ref: '#/components/schemas/Identifier'}}}
            - {type: object, additionalProperties: false, required: [team], properties: {team: {$ref: '#/components/schemas/Identifier'}}}
        permission: {type: string, enum: [read, write, admin]}
        created_unix_ms: {type: integer, minimum: 0}
        updated_unix_ms: {type: integer, minimum: 0}
