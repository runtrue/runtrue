        expected_version: {type: integer, minimum: 1}
        display_name: {type: string, minLength: 1, maxLength: 512}
        primary_email: {type: string, format: email, maxLength: 320}
        status: {type: string, enum: [active, suspended, disabled]}
    HumanUserPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/HumanUser'}}
        next_cursor: {type: ['string', 'null']}
    Team:
      type: object
