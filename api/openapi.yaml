        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    browserAccess:
      type: apiKey
      in: cookie
      name: runtrue_access
    browserRefresh:
      type: apiKey
      in: cookie
      name: runtrue_refresh
    browserCsrf:
      type: apiKey
      in: cookie
      name: runtrue_csrf
  requestBodies:
    BrowserFormMutation:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [csrf_token]
            properties:
              csrf_token: {type: string, minLength: 1, maxLength: 8192}
            additionalProperties:
              type: string
              maxLength: 1048576
  headers:
    IdempotencyReplayed:
      description: Whether this response represents an earlier durable mutation
      schema: {type: string, enum: ['true', 'false']}
  parameters:
    RepositoryId:
      name: repository_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    CapsuleId:
      name: capsule_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    EventId:
      name: event_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    RunnerPoolId:
      name: runner_pool_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    RunnerFleetRequestId:
      name: fleet_request_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    RunnerId:
      name: runner_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    CacheEntryId:
      name: cache_entry_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    Scope:
      name: scope
      in: path
      required: true
      description: Encoded scope, for example repository:repo_01 or environment:production
      schema: {type: string, minLength: 1, maxLength: 8192}
    Name:
      name: name
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 8192}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, minLength: 1, maxLength: 8192}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional mutation key scoped to the operation and resource
      schema: {type: string, minLength: 1, maxLength: 200}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Must exactly match the record-bound token also accepted as the csrf_token form field.
      schema: {type: string, minLength: 1, maxLength: 1024}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Bearer or webhook authentication failed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Authenticated principal is not authorized
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Idempotency subject, immutable state, approval subject, lease, or fence conflict
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PayloadTooLarge:
      description: Request body exceeds the endpoint bound
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnprocessableEntity:
      description: Authenticated webhook is unsupported or malformed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: Durable service or configured integration unavailable
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 8192
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok, ready]}
    CsrfMutation:
      type: object
      additionalProperties: false
      properties:
        csrf_token: {type: string, minLength: 1, maxLength: 1024}
    BrowserSessionStatus:
      type: object
      additionalProperties: false
      required: [principal_id, tenant_id, device_id, access_generation, access_expires_unix_ms, refresh_expires_unix_ms, absolute_expires_unix_ms, mfa_authenticated_unix_ms, csrf_token]
      properties:
        principal_id: {$ref: '#/components/schemas/Identifier'}
        tenant_id: {$ref: '#/components/schemas/Identifier'}
        device_id: {$ref: '#/components/schemas/Identifier'}
        access_generation: {type: integer, minimum: 1}
        access_expires_unix_ms: {type: integer, minimum: 1}
        refresh_expires_unix_ms: {type: integer, minimum: 1}
        absolute_expires_unix_ms: {type: integer, minimum: 1}
        mfa_authenticated_unix_ms: {type: ['integer', 'null'], minimum: 0}
        csrf_token:
          type: string
          minLength: 1
          maxLength: 1024
          description: Returned only to the authenticated same-origin browser under no-store for a subsequent form/header mutation.
    BrowserPolicyStatus:
      type: object
      additionalProperties: false
      required: [tenant_id, policy_epoch, decision_cache_generation, active_policy_digest]
      properties:
        tenant_id: {$ref: '#/components/schemas/Identifier'}
        policy_epoch: {type: integer, minimum: 0}
        decision_cache_generation: {type: integer, minimum: 0}
        active_policy_digest:
          oneOf:
            - {$ref: '#/components/schemas/Digest'}
            - {type: 'null'}
    Repository:
      type: object
      additionalProperties: false
      required: [id, owner, name, default_branch, visibility]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        owner: {type: string}
        name: {type: string}
        default_branch: {type: string}
        visibility: {type: string}
    CreateRepositoryRequest:
      type: object
      additionalProperties: false
      required: [owner, name]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        tenant_id: {$ref: '#/components/schemas/Identifier'}
