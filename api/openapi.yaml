      operationId: revokeApiToken
      parameters:
        - name: token_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Identifier'}
      responses:
        '204': {description: Token revoked; delegated descendants become unusable through ancestry validation}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    browserAccess:
      type: apiKey
      in: cookie
      name: runtrue_access
    browserRefresh:
      type: apiKey
      in: cookie
      name: runtrue_refresh
    browserCsrf:
      type: apiKey
      in: cookie
      name: runtrue_csrf
  requestBodies:
    BrowserFormMutation:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [csrf_token]
            properties:
              csrf_token: {type: string, minLength: 1, maxLength: 8192}
            additionalProperties:
              type: string
              maxLength: 1048576
  headers:
    IdempotencyReplayed:
      description: Whether this response represents an earlier durable mutation
      schema: {type: string, enum: ['true', 'false']}
  parameters:
    RepositoryId:
      name: repository_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    CapsuleId:
      name: capsule_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    RunnerPoolId:
      name: runner_pool_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    RunnerId:
      name: runner_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    CacheEntryId:
      name: cache_entry_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    Scope:
      name: scope
      in: path
      required: true
      description: Encoded scope, for example repository:repo_01 or environment:production
      schema: {type: string, minLength: 1, maxLength: 8192}
    Name:
      name: name
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 8192}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, minLength: 1, maxLength: 8192}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional mutation key scoped to the operation and resource
      schema: {type: string, minLength: 1, maxLength: 200}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Must exactly match the record-bound token also accepted as the csrf_token form field.
      schema: {type: string, minLength: 1, maxLength: 1024}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Bearer or webhook authentication failed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Authenticated principal is not authorized
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Idempotency subject, immutable state, approval subject, lease, or fence conflict
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PayloadTooLarge:
      description: Request body exceeds the endpoint bound
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnprocessableEntity:
      description: Authenticated webhook is unsupported or malformed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: Durable service or configured integration unavailable
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 8192
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok, ready]}
    CsrfMutation:
      type: object
      additionalProperties: false
      properties:
        csrf_token: {type: string, minLength: 1, maxLength: 1024}
    BrowserSessionStatus:
      type: object
      additionalProperties: false
      required: [principal_id, tenant_id, device_id, access_generation, access_expires_unix_ms, refresh_expires_unix_ms, absolute_expires_unix_ms, mfa_authenticated_unix_ms, csrf_token]
      properties:
        principal_id: {$ref: '#/components/schemas/Identifier'}
        tenant_id: {$ref: '#/components/schemas/Identifier'}
        device_id: {$ref: '#/components/schemas/Identifier'}
        access_generation: {type: integer, minimum: 1}
        access_expires_unix_ms: {type: integer, minimum: 1}
        refresh_expires_unix_ms: {type: integer, minimum: 1}
        absolute_expires_unix_ms: {type: integer, minimum: 1}
        mfa_authenticated_unix_ms: {type: ['integer', 'null'], minimum: 0}
        csrf_token:
          type: string
          minLength: 1
          maxLength: 1024
          description: Returned only to the authenticated same-origin browser under no-store for a subsequent form/header mutation.
    BrowserPolicyStatus:
      type: object
      additionalProperties: false
      required: [tenant_id, policy_epoch, decision_cache_generation, active_policy_digest]
      properties:
        tenant_id: {$ref: '#/components/schemas/Identifier'}
        policy_epoch: {type: integer, minimum: 0}
        decision_cache_generation: {type: integer, minimum: 0}
        active_policy_digest:
          oneOf:
            - {$ref: '#/components/schemas/Digest'}
            - {type: 'null'}
    Repository:
      type: object
      additionalProperties: false
      required: [id, owner, name, default_branch, visibility]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        owner: {type: string}
        name: {type: string}
        default_branch: {type: string}
        visibility: {type: string}
    CreateRepositoryRequest:
      type: object
      additionalProperties: false
      required: [owner, name]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        tenant_id: {$ref: '#/components/schemas/Identifier'}
        owner: {type: string, minLength: 1, maxLength: 8192}
        name: {type: string, minLength: 1, maxLength: 8192}
        default_branch: {type: string, minLength: 1, maxLength: 8192, default: main}
        visibility: {type: string, minLength: 1, maxLength: 8192, default: private}
    RepositoryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Repository'}
        next_cursor: {type: ['string', 'null']}
    CreateCapsuleRequest:
      type: object
      additionalProperties: false
      required: [source_commit, workflow_yaml, event]
      properties:
        source_commit: {type: string, minLength: 1, maxLength: 8192}
        base_commit: {type: ['string', 'null'], maxLength: 8192}
        workflow_path:
          type: string
          minLength: 1
          maxLength: 8192
          default: .runtrue/workflows/ci.yaml
        workflow_yaml: {type: string, minLength: 1, maxLength: 1048576}
        event: {type: object}
        lockfile_toml:
          type: ['string', 'null']
          maxLength: 4194304
          description: Exact strict `.runtrue.lock` TOML compiled into the signed capsule.
        reusable_workflows:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/ReusableWorkflowSource'}
          description: Exact authenticated source bytes for every `[[workflow]]` lock entry; total decoded source bytes are limited to 8 MiB.
        selected_job:
          type: ['string', 'null']
          minLength: 1
          maxLength: 8192
          description: Optional job or matrix base id, including its dependency closure.
    ReusableWorkflowSource:
      type: object
      additionalProperties: false
      required: [reference, commit, source_hex]
      properties:
        reference: {type: string, minLength: 1, maxLength: 4096}
        commit: {type: string, minLength: 1, maxLength: 128}
        source_hex:
          type: string
          maxLength: 2097152
          pattern: '^[0-9a-f]*$'
          description: Lowercase hex encoding of at most 1 MiB of exact reusable-workflow bytes.
    ExecutionCapsule:
      type: object
      additionalProperties: false
      required: [id, repository_id, digest, status, workflow_digest, lock_digest, risk_score, approval_required, approval_requests, parity_grade, created_at, signature, capsule]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        repository_id: {$ref: '#/components/schemas/Identifier'}
        digest: {$ref: '#/components/schemas/Digest'}
        status: {type: string, const: signed}
        workflow_digest: {$ref: '#/components/schemas/Digest'}
        lock_digest:
          oneOf:
            - {$ref: '#/components/schemas/Digest'}
            - {type: 'null'}
        risk_score: {type: integer, minimum: 0, maximum: 100}
        approval_required: {type: boolean}
        approval_requests:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/CapsuleApprovalRequest'}
        parity_grade: {}
        created_at: {type: string, format: date-time}
        signature: {type: object}
        capsule: {type: object}
    CreateRunRequest:
      type: object
      additionalProperties: false
      properties:
        priority: {type: integer, format: int32, default: 0}
        source_snapshot_id:
          allOf: [{$ref: '#/components/schemas/Identifier'}]
          description: Required for a remote capsule whose signed context contains a source-tree digest; rejected for an unbound capsule.
    CapsuleApprovalRequest:
      type: object
      additionalProperties: false
      required: [id, approval_kind, subject_digest, status]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        approval_kind: {type: string, enum: [workflow-definition, privileged-execution]}
        subject_digest: {$ref: '#/components/schemas/Digest'}
        status: {type: string, enum: [pending, approved, denied, expired, consumed]}
    CancelRunRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 8192}
    Run:
      type: object
      additionalProperties: false
      required: [id, capsule_id, status, created_at, started_at, completed_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        capsule_id: {$ref: '#/components/schemas/Identifier'}
        status: {type: string}
        created_at: {type: string, format: date-time}
        started_at: {type: ['string', 'null'], format: date-time}
        completed_at: {type: ['string', 'null'], format: date-time}
    RunPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        next_cursor: {type: ['string', 'null']}
    RunLogFrame:
      type: object
      additionalProperties: false
      required: [execution_lease_id, fencing_generation, job_attempt, step_id, stream, sequence, monotonic_nanoseconds, wall_time_unix_ms, payload, redaction_state]
      properties:
        execution_lease_id: {$ref: '#/components/schemas/Identifier'}
        fencing_generation: {type: integer, minimum: 1}
        job_attempt: {type: integer, minimum: 1}
        step_id: {$ref: '#/components/schemas/Identifier'}
        stream: {type: string, enum: [stdout, stderr]}
        sequence: {type: integer, minimum: 0}
        monotonic_nanoseconds: {type: integer, minimum: 0}
        wall_time_unix_ms: {type: integer, minimum: 0}
        payload:
          type: array
          maxItems: 65536
          items: {type: integer, minimum: 0, maximum: 255}
          description: Redacted frame payload serialized as bytes.
        redaction_state: {type: string, minLength: 1, maxLength: 8192}
    CreateApiTokenRequest:
      type: object
      additionalProperties: false
      required: [principal_id, name, scopes, ttl_seconds]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        principal_id: {$ref: '#/components/schemas/Identifier'}
        tenant_id: {$ref: '#/components/schemas/Identifier'}
        name: {type: string, minLength: 1, maxLength: 8192}
        scopes:
          type: array
          uniqueItems: true
          maxItems: 256
          items: {type: string, minLength: 1, maxLength: 8192}
        ttl_seconds: {type: integer, minimum: 1, maximum: 31536000}
    ApiToken:
      type: object
      additionalProperties: false
      required: [id, principal_id, tenant_id, name, scopes, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        principal_id: {$ref: '#/components/schemas/Identifier'}
        tenant_id: {$ref: '#/components/schemas/Identifier'}
        name: {type: string}
        scopes:
          type: array
          uniqueItems: true
          items: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        last_used_at: {type: ['string', 'null'], format: date-time}
        revoked_at: {type: ['string', 'null'], format: date-time}
    IssuedApiToken:
      type: object
      additionalProperties: false
      required: [token, token_type, id, principal_id, tenant_id, name, scopes, created_at, expires_at, last_used_at, revoked_at]
      properties:
        token: {type: string, writeOnly: true}
        token_type: {type: string, const: Bearer}
        id: {$ref: '#/components/schemas/Identifier'}
        principal_id: {$ref: '#/components/schemas/Identifier'}
        tenant_id: {$ref: '#/components/schemas/Identifier'}
        name: {type: string}
        scopes:
          type: array
          uniqueItems: true
          items: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        last_used_at: {type: ['string', 'null'], format: date-time}
        revoked_at: {type: ['string', 'null'], format: date-time}
      description: The bearer token is returned once and never appears in metadata reads.
    ApiTokenPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ApiToken'}
        next_cursor: {type: ['string', 'null']}
    ReplayBundleMetadata:
      type: object
      additionalProperties: false
      required: [id, digest, run_id, download_url, expires_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        digest: {$ref: '#/components/schemas/Digest'}
        run_id: {$ref: '#/components/schemas/Identifier'}
        download_url: {type: string, format: uri-reference}
        expires_at: {type: string, format: date-time}
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [id, subject_digest, approval_kind, status, risk_score, expires_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        subject_digest: {$ref: '#/components/schemas/Digest'}
        approval_kind: {type: string}
        status: {type: string, enum: [pending, approved, denied, expired, consumed]}
        risk_score: {type: integer, minimum: 0, maximum: 100}
        expires_at: {type: ['string', 'null'], format: date-time}
    ApprovalDecisionRequest:
      type: object
