    EffectiveRepositoryAccessPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/EffectiveRepositoryAccess'}}
        next_cursor: {type: ['string', 'null']}
    CreateCapsuleRequest:
      type: object
      additionalProperties: false
      required: [source_commit, workflow_yaml, event]
      properties:
        source_commit: {type: string, minLength: 1, maxLength: 8192}
        base_commit: {type: ['string', 'null'], maxLength: 8192}
        workflow_path:
          type: string
          minLength: 1
          maxLength: 8192
          default: .runtrue/workflows/ci.yaml
        workflow_yaml: {type: string, minLength: 1, maxLength: 1048576}
        event: {type: object}
        lockfile_toml:
          type: ['string', 'null']
          maxLength: 4194304
          description: Exact strict `.runtrue.lock` TOML compiled into the signed capsule.
        reusable_workflows:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/ReusableWorkflowSource'}
          description: Exact authenticated source bytes for every `[[workflow]]` lock entry; total decoded source bytes are limited to 8 MiB.
        selected_job:
          type: ['string', 'null']
          minLength: 1
          maxLength: 8192
          description: Optional job or matrix base id, including its dependency closure.
    ReusableWorkflowSource:
      type: object
      additionalProperties: false
      required: [reference, commit, source_hex]
      properties:
        reference: {type: string, minLength: 1, maxLength: 4096}
        commit: {type: string, minLength: 1, maxLength: 128}
        source_hex:
          type: string
          maxLength: 2097152
          pattern: '^[0-9a-f]*$'
          description: Lowercase hex encoding of at most 1 MiB of exact reusable-workflow bytes.
    ExecutionCapsule:
      type: object
      additionalProperties: false
      required: [id, repository_id, digest, status, workflow_digest, lock_digest, risk_score, approval_required, approval_requests, parity_grade, created_at, signature, capsule, workflow_frontend_report]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        repository_id: {$ref: '#/components/schemas/Identifier'}
        digest: {$ref: '#/components/schemas/Digest'}
        status: {type: string, const: signed}
        workflow_digest: {$ref: '#/components/schemas/Digest'}
        lock_digest:
          oneOf:
            - {$ref: '#/components/schemas/Digest'}
            - {type: 'null'}
        risk_score: {type: integer, minimum: 0, maximum: 100}
        approval_required: {type: boolean}
        approval_requests:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/CapsuleApprovalRequest'}
        parity_grade: {}
        created_at: {type: string, format: date-time}
        signature: {type: object}
        capsule: {type: object}
        workflow_frontend_report:
          oneOf:
            - {$ref: '#/components/schemas/WorkflowFrontendReportLink'}
            - {type: 'null'}
    WorkflowFrontendReportLink:
      type: object
      additionalProperties: false
      required: [media_type, digest, download_url]
      properties:
        media_type: {type: string, minLength: 3, maxLength: 255}
        digest: {$ref: '#/components/schemas/Digest'}
        download_url: {type: string, minLength: 1, maxLength: 8192}
    CreateRunRequest:
      type: object
      additionalProperties: false
      properties:
        priority: {type: integer, format: int32, default: 0}
        source_snapshot_id:
          allOf: [{$ref: '#/components/schemas/Identifier'}]
          description: Required for a remote capsule whose signed context contains a source-tree digest; rejected for an unbound capsule.
    CapsuleApprovalRequest:
      type: object
      additionalProperties: false
      required: [id, approval_kind, subject_digest, status]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        approval_kind: {type: string, enum: [workflow-definition, privileged-execution]}
        subject_digest: {$ref: '#/components/schemas/Digest'}
        status: {type: string, enum: [pending, approved, denied, expired, consumed]}
    CancelRunRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 8192}
    Run:
      type: object
      additionalProperties: false
      required: [id, capsule_id, status, created_at, started_at, completed_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        capsule_id: {$ref: '#/components/schemas/Identifier'}
        status: {type: string}
        created_at: {type: string, format: date-time}
        started_at: {type: ['string', 'null'], format: date-time}
        completed_at: {type: ['string', 'null'], format: date-time}
    RunPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        next_cursor: {type: ['string', 'null']}
    DurableEvent:
      type: object
      additionalProperties: false
      required: [id, source, kind, payload_digest, status, attempts, created_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        source: {type: string, enum: [frontend, backend, system]}
        kind: {type: string, minLength: 1, maxLength: 8192}
        payload_digest: {$ref: '#/components/schemas/Digest'}
        status: {type: string, enum: [pending, claimed, completed, failed]}
