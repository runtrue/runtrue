        maximum_workers: {type: integer, minimum: 0}
        scale_up_batch: {type: integer, minimum: 0}
        idle_timeout_ms: {type: integer, minimum: 0}
        offline_grace_ms: {type: integer, minimum: 0}
        cooldown_ms: {type: integer, minimum: 0}
        enabled: {type: boolean}
        updated_unix_ms: {type: integer, minimum: 0}
    RunnerPoolTemplate:
