      required: [id, policy_id, version, source, mode, digest, created_unix_ms]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        policy_id: {$ref: '#/components/schemas/Identifier'}
        version: {type: integer, minimum: 1}
        source: {type: string}
        mode: {type: string, enum: [draft, shadow, enforce]}
        digest: {$ref: '#/components/schemas/Digest'}
        created_unix_ms: {type: integer, minimum: 0}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [sequence, installation_id, data, event_hash]
      properties:
        sequence: {type: integer, minimum: 1}
        installation_id: {$ref: '#/components/schemas/Identifier'}
