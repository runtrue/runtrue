      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateApiTokenRequest'}
      responses:
        '201':
          description: One-time bearer value and durable token metadata
          headers:
            Cache-Control:
              description: One-time bearer responses are never cacheable.
              schema: {type: string, const: no-store}
            Pragma:
              description: Legacy cache prevention for the one-time bearer response.
              schema: {type: string, const: no-cache}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedApiToken'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
