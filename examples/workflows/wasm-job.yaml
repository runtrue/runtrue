version: 1
name: locked-wasm-component

"on":
  manual: {}

permissions:
  network: deny

jobs:
  analyze:
    runner:
      os: linux
      arch: amd64
      isolation: wasm
      memory: 128MiB
    steps:
      - id: analyze
        uses: wasm://registry.example/runtrue/analyze@v1
        with:
          profile: strict
